<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>404 not found</title>

<style>

body {
    margin: 0;
    background: #050608;
    color: #aeb8c4;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    touch-action: manipulation;
}

.wrapper {
    width: 100%;
    display: flex;
    justify-content: center;

    padding-top: 64px;
    padding-bottom: 260px;
}

.scene {
    width: 96%;
    max-width: 1200px;
}

.image-area {
    position: relative;
}

.scene img {
    width: 100%;
    display: block;

    filter:
        brightness(0.95)
        contrast(1.06)
        saturate(0.9);
}

.log {
    margin-top: 18px;
    margin-left: 6px;

    font-size: 11px;
    line-height: 1.8;

    opacity: 0.38;
    letter-spacing: 0.08em;
}

.hotspot {
    position: absolute;
    display: block;

    background: rgba(255,0,0,0.0);
    border: none;
    z-index: 20;
}

/* 404の0 */
/* 位置はあとで赤表示して微調整 */

.zero {
    left: 18%;
    top: 12%;

    width: 9%;
    height: 12%;
}

/* return / back 周辺 */

.return-zone {
    left: 63%;
    top: 78%;

    width: 18%;
    height: 15%;
}

/* モニター */

.monitor {
    left: 15%;
    top: 56%;

    width: 19%;
    height: 15%;
}

/* スマホ */

@media (max-width: 700px) {

    .wrapper {
        padding-top: 38px;
        padding-bottom: 180px;
    }

    .scene {
        width: 98%;
    }

    .log {
        font-size: 10px;
        opacity: 0.34;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="scene">

        <div class="image-area">

            <img src="404-001.png" alt="404 not found">

            <!-- 404の0：本当の入口 -->
            <a class="hotspot zero"
               href="true-archive.html">&nbsp;</a>

            <!-- return：表のarchiveへ戻る -->
            <a class="hotspot return-zone"
               href="archive.html">&nbsp;</a>

            <!-- モニター：地下へ戻る -->
            <a class="hotspot monitor"
               href="underground.html">&nbsp;</a>

        </div>

        <div class="log">
            error_log_404<br>
            not found / still watching
        </div>

    </div>

</div>

</body>
</html>
