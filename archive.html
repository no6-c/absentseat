<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>archive</title>

<style>

body {
    margin: 0;
    background: #07090d;
    color: #cfd6df;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-top: 80px;
    padding-bottom: 220px;
}

.scene {
    position: relative;
    width: 94%;
    max-width: 1400px;
}

.scene img {
    width: 100%;
    display: block;
}

.image-area {
    position: relative;
}
    
.log {
    margin-top: 18px;
    margin-left: 6px;
    font-size: 11px;
    line-height: 1.8;
    opacity: 0.45;
    letter-spacing: 0.08em;
}

/* hotspot */

.hotspot {
    position: absolute;
    display: block;

    /*
    ↓ デバッグ中だけ少し見えるように
    完成後は opacity:0; にする
    */
    background: rgba(255,0,0,0.0);

    border:none;
}

/* ガールズバー位置 */

.girlsbar {
    left: 72%;
    top: 12%;

    width: 18%;
    height: 16%;
}

/* 駄菓子屋位置 */

.dagashi {
    left: 75%;
    top: 39%;

    width: 19%;
    height: 34%;
}


/* マンホール */

.manhole {

    left: 40%;
    top: 82%;

    width: 10%;
    height: 10%;
}
</style>
</head>

<body>

<div class="wrapper">
    
<div class="scene">

    <div class="image-area">

        <img src="absentseat-003.png" alt="archive">

        <!-- ガールズバー -->
        <a class="hotspot girlsbar"
           href="tenjiku.html">&nbsp;</a>

        <!-- 駄菓子屋 -->
        <a class="hotspot dagashi"
           href="dagashi.html">&nbsp;</a>

        <!-- マンホール -->
        <a id="manholeGate"
           class="hotspot manhole"
           href="#">&nbsp;</a>

    </div>

    <div class="log">
            archive_log_01<br>
            late winter / weak signal
        </div>

    </div>

</div>

<script>

let tapCount = 0;

document.getElementById("manholeGate")
.addEventListener("click", function(event) {

    event.preventDefault();

    tapCount++;

    if (tapCount >= 10) {

        window.location.href =
        "underground.html";
    }

});

</script>
    
</body>
</html>
