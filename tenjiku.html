<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>tenjiku</title>

<style>
body {
    margin: 0;
    background: #090506;
    color: #d2c1a3;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-top: 90px;
    padding-bottom: 240px;
}

.scene {
    position: relative;
    width: 94%;
    max-width: 1400px;
}

.scene img {
    width: 100%;
    display: block;
    filter: brightness(0.92) contrast(1.06);
}

.log {
    margin-top: 18px;
    margin-left: 6px;
    font-size: 11px;
    line-height: 1.8;
    opacity: 0.42;
    letter-spacing: 0.08em;
}

.return {
    display: inline-block;
    margin-top: 80px;
    margin-left: 6px;
    font-size: 10px;
    color: #d2c1a3;
    opacity: 0.28;
    text-decoration: none;
    letter-spacing: 0.12em;
}

.return:hover {
    opacity: 0.7;
}

/* hidden links / hotspots */
.hotspot {
    position: absolute;
    display: block;
    opacity: 0;
}

/* 仮：画像右上あたり */
.hotspot-01 {
    left: 68%;
    top: 18%;
    width: 18%;
    height: 24%;
}

/* 仮：画像左下あたり */
.hotspot-02 {
    left: 8%;
    top: 62%;
    width: 20%;
    height: 22%;
}

/* スマホ調整 */
@media (max-width: 700px) {
    .wrapper {
        padding-top: 45px;
        padding-bottom: 180px;
    }

    .scene {
        width: 96%;
    }

    .log {
        font-size: 10px;
        opacity: 0.38;
    }

    .return {
        margin-top: 60px;
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="wrapper">
    <div class="scene">

        <img src="tenjiku-001.png" alt="tenjiku">

        <!-- hidden route / later adjustment -->
        <a class="hotspot hotspot-01" href="404.html"></a>
        <a class="hotspot hotspot-02" href="archive.html"></a>

        <div class="log">
            archive_log_14<br>
            route mismatch / saturated faith
        </div>

        <a class="return" href="archive.html">return to arcade</a>

    </div>
</div>

</body>
</html>
