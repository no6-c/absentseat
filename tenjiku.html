<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>tenjiku</title>

<style>

body {
    margin: 0;
    background: #090506;
    color: #d2c1a3;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

.wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-top: 90px;
    padding-bottom: 240px;
}

.scene {
    position: relative;
    width: 94%;
    max-width: 1400px;
}

.scene img {
    width: 100%;
    display: block;

    filter:
        brightness(0.92)
        contrast(1.06);
}

.log {
    margin-top: 18px;
    margin-left: 6px;

    font-size: 11px;
    line-height: 1.8;

    opacity: 0.42;

    letter-spacing: 0.08em;
}

/* hotspot */

.hotspot {
    position: absolute;
    display: block;

    background: rgba(255,0,0,0.0);
    border: none;
}

/* 釈迦の小銭 */
/* 後で位置微調整 */

.shift {

    left: 30%;
    top: 85%;

    width: 12%;
    height: 10%;
}

/* deeper archive */

.deep {

    left: 76%;
    top: 16%;

    width: 10%;
    height: 14%;
}

/* スマホ */

@media (max-width: 700px) {

    .wrapper {
        padding-top: 45px;
        padding-bottom: 180px;
    }

    .scene {
        width: 96%;
    }

    .log {
        font-size: 10px;
        opacity: 0.38;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="scene">

        <img src="tenjiku-001.png" alt="tenjiku">

        <!-- 小銭 → 俗世 -->
        <a class="hotspot shift"
           href="tenjiku-shift.html"></a>

        <!-- deeper -->
        <a class="hotspot deep"
           href="404.html"></a>

        <div class="log">
            archive_log_14<br>
            route mismatch / saturated faith
        </div>

    </div>

</div>

</body>
</html>
