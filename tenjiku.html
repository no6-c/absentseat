<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>tenjiku</title>

<style>

body {
    margin: 0;
    background: #090506;
    color: #d2c1a3;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

/* 全体 */

.wrapper {
    width: 100%;
    display: flex;
    justify-content: center;
    padding-top: 90px;
    padding-bottom: 240px;
}

/* 画像空間 */

.scene {
    position: relative;
    width: 94%;
    max-width: 1400px;
}

/* 画像 */

.scene img {
    width: 100%;
    display: block;

    filter:
        brightness(0.92)
        contrast(1.06);
}

/* ログ */

.log {
    margin-top: 18px;
    margin-left: 6px;

    font-size: 11px;
    line-height: 1.8;

    opacity: 0.42;

    letter-spacing: 0.08em;
}

/* return */

.return {
    display: inline-block;

    margin-top: 80px;
    margin-left: 6px;

    font-size: 10px;

    color: #d2c1a3;

    opacity: 0.28;

    text-decoration: none;

    letter-spacing: 0.12em;
}

.return:hover {
    opacity: 0.7;
}

/* hotspot */

.hotspot {
    position: absolute;
    display: block;

    background: rgba(255,0,0,0.0);
    border: none;
}

/* 神聖⇄俗世 切替ポイント */
/* 後で微調整 */

.shift {
    left: 47%;
    top: 58%;

    width: 12%;
    height: 14%;
}

/* deeper archive 用 */

.deep {
    left: 76%;
    top: 16%;

    width: 10%;
    height: 14%;
}

/* archive 戻り */

.back {
    left: 8%;
    top: 62%;

    width: 20%;
    height: 22%;
}

/* スマホ */

@media (max-width: 700px) {

    .wrapper {
        padding-top: 45px;
        padding-bottom: 180px;
    }

    .scene {
        width: 96%;
    }

    .log {
        font-size: 10px;
        opacity: 0.38;
    }

    .return {
        margin-top: 60px;
        font-size: 9px;
    }
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="scene">

        <!-- 神聖版 -->
        <img src="tenjiku-001.png" alt="tenjiku">

        <!-- 神聖→俗世 -->
        <a class="hotspot shift"
           href="tenjiku-shift.html"></a>

        <!-- deeper route -->
        <a class="hotspot deep"
           href="404.html"></a>

        <!-- arcade return -->
        <a class="hotspot back"
           href="archive.html"></a>

        <div class="log">
            archive_log_14<br>
            route mismatch / saturated faith
        </div>

        <a class="return" href="archive.html">
            return to arcade
        </a>

    </div>

</div>

</body>
</html>
